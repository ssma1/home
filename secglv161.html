<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ССБА — Управление Контентом</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, orderBy, onSnapshot, doc, deleteDoc, updateDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyANXc2iamJlauk-xsFYiITOBYBh1sUCKqU",
            authDomain: "ssba-58900.firebaseapp.com",
            databaseURL: "https://ssba-58900-default-rtdb.firebaseio.com",
            projectId: "ssba-58900",
            storageBucket: "ssba-58900.firebasestorage.app",
            messagingSenderId: "615638249829",
            appId: "1:615638249829:web:a68cd961fa79ebc7ef718c",
            measurementId: "G-ZY8PQ2DXE3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const cloudName = "dkxz31t7k"; 
        const uploadPreset = "ml_default";

        let currentEditDocId = "";
        let currentEditCollection = "";
        let currentEditMediaUrl = "";

        // ========== "О НАС" ==========
        window.saveAboutText = async function() {
            const newText = document.getElementById("about-edit-textarea").value.trim();
            if (!newText) return alert("Введите текст!");
            
            const pass = prompt("Введите пароль:");
            if (pass === null) return;

            try {
                await setDoc(doc(db, "about", "main_info"), {
                    text: newText,
                    secretPassword: pass  // Правила проверят сами
                });
                alert("Описание обновлено!");
            } catch(e) {
                alert("Ошибка: " + e.message);
            }
        };

        function loadAboutEditor() {
            onSnapshot(doc(db, "about", "main_info"), (docSnap) => {
                if (docSnap.exists() && docSnap.data().text) {
                    document.getElementById("about-edit-textarea").value = docSnap.data().text;
                }
            });
        }

        // ========== УДАЛЕНИЕ ==========
        window.deletePost = async function(collectionName, docId) {
            if (!confirm("Удалить эту публикацию?")) return;
            
            const pass = prompt("Введите пароль для удаления:");
            if (pass === null) return;
            
            // 🔐 Пароль НЕ ПРОВЕРЯЕТСЯ в коде!
            // Просто передаём его в Firestore через updateDoc ПЕРЕД удалением
            // ИЛИ используем другой подход...

            // ⚠️ ПРОБЛЕМА: deleteDoc() НЕ МОЖЕТ передать данные!
            // Поэтому этот способ НЕ РАБОТАЕТ для удаления
            // deleteDoc(doc(db, collectionName, docId)) — нельзя передать пароль

            alert("Удаление через Rules с паролем невозможно! deleteDoc() не передаёт данные.");
        };

        // ========== РЕДАКТИРОВАНИЕ ==========
        window.openEditModal = function(collectionName, docId, title, text, mediaUrl) {
            currentEditDocId = docId;
            currentEditCollection = collectionName;
            currentEditMediaUrl = mediaUrl || "";

            document.getElementById("edit-title").value = title || "";
            document.getElementById("edit-text").value = text || "";
            document.getElementById("edit-upload-status").innerText = mediaUrl ? "Файл есть" : "Файла нет";
            document.getElementById("edit-upload-status").style.color = "#8a8a8f";

            const fileInput = document.getElementById("edit-hidden-file-input");
            if (collectionName === 'posts' || collectionName === 'photo') fileInput.accept = "image/*";
            else if (collectionName === 'video') fileInput.accept = "video/*";
            else if (collectionName === 'music') fileInput.accept = "audio/*";
            else if (collectionName === 'books') fileInput.accept = ".pdf,.epub,.fb2,.txt";

            document.getElementById("edit-modal").style.display = "flex";
        };

        window.closeEditModal = function() {
            document.getElementById("edit-modal").style.display = "none";
        };

        window.triggerEditUpload = () => document.getElementById("edit-hidden-file-input").click();

        window.handleEditFileChange = async function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', uploadPreset);

            const status = document.getElementById("edit-upload-status");
            const saveBtn = document.getElementById("save-btn");

            try {
                saveBtn.disabled = true;
                status.innerText = "Загрузка...";
                status.style.color = "#ffaa00";

                let resourceType = "image";
                if (currentEditCollection === "video" || currentEditCollection === "music") resourceType = "video";
                if (currentEditCollection === "books") resourceType = "raw";

                const response = await fetch(`https://api.cloudinary.com/v1_1/${cloudName}/${resourceType}/upload`, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) throw new Error("Ошибка загрузки");

                const data = await response.json();
                currentEditMediaUrl = data.secure_url;
                status.innerText = "Файл загружен!";
                status.style.color = "#00ff00";
            } catch (error) {
                alert("Ошибка: " + error.message);
                status.innerText = "Ошибка";
                status.style.color = "#ff0000";
            } finally {
                saveBtn.disabled = false;
            }
        };

        // ========== РЕДАКТИРОВАНИЕ ==========
        window.saveChanges = async function() {
            const pass = prompt("Введите пароль:");
            if (pass === null) return;

            const updatedTitle = document.getElementById("edit-title").value.trim();
            const updatedText = document.getElementById("edit-text").value.trim();

            try {
                // 🔐 Правила проверят пароль через request.resource.data.secretPassword
                await updateDoc(doc(db, currentEditCollection, currentEditDocId), {
                    title: updatedTitle,
                    text: updatedText,
                    mediaUrl: currentEditMediaUrl,
                    secretPassword: pass  // Передаём пароль в запросе
                });
                alert("Сохранено!");
                closeEditModal();
            } catch (e) {
                alert("Ошибка: " + e.message);
            }
        };

        // ========== ЗАГРУЗКА СПИСКОВ ==========
        function loadAdminSection(collectionName, containerId, renderFn) {
            const container = document.getElementById(containerId);
            const q = query(collection(db, collectionName), orderBy("createdAt", "desc"));

            onSnapshot(q, (snapshot) => {
                if (snapshot.empty) {
                    container.innerHTML = `<div class="card"><p style="text-align:center; color:#666;">Нет публикаций.</p></div>`;
                    return;
                }
                container.innerHTML = "";
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const id = doc.id;
                    
                    const safeTitle = (data.title || "").replace(/'/g, "\\'").replace(/"/g, '\\"');
                    const safeText = (data.text || "").replace(/'/g, "\\'").replace(/"/g, '\\"');
                    const safeUrl = (data.mediaUrl || "").replace(/'/g, "\\'").replace(/"/g, '\\"');
                    
                    const viewsCount = data.views || 0;

                    container.innerHTML += `
                        <div class="card">
                            <div class="card-body-content">
                                ${renderFn(data)}
                            </div>
                            <div class="admin-views-badge">
                                <i class="material-icons">visibility</i>
                                <span>Просмотры: ${viewsCount}</span>
                            </div>
                            <div class="admin-actions">
                                <button class="action-btn edit-btn" onclick="openEditModal('${collectionName}', '${id}', '${safeTitle}', '${safeText}', '${safeUrl}')">Изменить</button>
                                <button class="action-btn delete-btn" onclick="deletePost('${collectionName}', '${id}')">Удалить</button>
                            </div>
                        </div>
                    `;
                });
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadAboutEditor();
            
            loadAdminSection("posts", "posts-container", (data) => `
                <h3>${data.title || "[Без заголовка]"}</h3>
                <p>${data.text}</p>
                ${data.mediaUrl ? `<img src="${data.mediaUrl}" class="loaded-media">` : ''}
            `);

            loadAdminSection("photo", "photo-container", (data) => `
                <h3>${data.title || "[Без заголовка]"}</h3>
                <img src="${data.mediaUrl}" class="loaded-media">
                <p>${data.text || ""}</p>
            `);

            loadAdminSection("video", "video-container", (data) => `
                <h3>${data.title || "[Без заголовка]"}</h3>
                <video src="${data.mediaUrl}" controls class="loaded-media"></video>
                <p>${data.text || ""}</p>
            `);

            loadAdminSection("music", "music-container", (data) => `
                <h3>${data.title || "[Без заголовка]"}</h3>
                <audio src="${data.mediaUrl}" controls class="audio-player-custom"></audio>
                <p>${data.text || ""}</p>
            `);

            loadAdminSection("books", "books-container", (data) => `
                <h3>${data.title || "[Без заголовка]"}</h3>
                <p>${data.text || ""}</p>
                <a href="${data.mediaUrl}" target="_blank" class="btn">Открыть файл</a>
            `);
        });
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #121214; color: #fff; font-family: Arial, sans-serif; }
        header { background: #121214; padding: 40px 20px 20px; text-align: center; }
        .logo h1 { font-family: 'Montserrat', sans-serif; font-size: 3.5rem; font-weight: 900; color: #EBEBEB; text-transform: uppercase; text-shadow: 4px 4px 0px #dd0000; }
        .secret-tag { color: #dd0000; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; font-size: 0.9rem; }
        .red-bar { width: 100%; height: 5px; background: #dd0000; }
        .main-content-wrapper { background: #0f0f11; padding: 50px 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        section { margin-bottom: 60px; }
        .section-title { font-family: 'Montserrat', sans-serif; font-size: 2rem; text-transform: uppercase; border-left: 6px solid #dd0000; padding-left: 15px; margin-bottom: 30px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; }
        .card { background: rgba(26,26,28,0.92); border: 1px solid #2d2d30; padding: 25px; display: flex; flex-direction: column; }
        .card-body-content { flex-grow: 1; }
        .card h3 { font-family: 'Montserrat', sans-serif; font-size: 1.3rem; text-transform: uppercase; margin-bottom: 12px; color: #dd0000; }
        .card p { color: #bbb; font-size: 0.95rem; white-space: pre-wrap; }
        .admin-views-badge { display: flex; align-items: center; gap: 6px; color: #8a8a8f; font-size: 0.85rem; margin: 15px 0 0; background: #1a1a1c; padding: 4px 8px; border: 1px solid #2d2d30; }
        .admin-views-badge .material-icons { font-size: 16px; color: #dd0000; }
        .loaded-media { width: 100%; max-height: 250px; object-fit: contain; background: #121214; border: 1px solid #2d2d30; margin-bottom: 15px; }
        .audio-player-custom { width: 100%; margin-bottom: 15px; }
        .btn { display: inline-block; padding: 8px 15px; background: #333; color: #fff; text-decoration: none; font-weight: bold; text-transform: uppercase; font-size: 0.8rem; }
        .about-edit-box { background: #1a1a1c; border: 1px solid #2d2d30; padding: 25px; margin-bottom: 30px; }
        .about-edit-box textarea { width: 100%; min-height: 100px; background: #121214; border: 1px solid #2d2d30; color: #fff; padding: 15px; font-size: 1rem; resize: vertical; margin-bottom: 15px; }
        .about-edit-box textarea:focus { outline: none; border-color: #dd0000; }
        .admin-actions { display: flex; gap: 10px; margin-top: 12px; border-top: 1px solid #2d2d30; padding-top: 15px; }
        .action-btn { flex: 1; padding: 12px; font-weight: bold; text-transform: uppercase; font-size: 0.85rem; cursor: pointer; border: none; font-family: Arial, sans-serif; }
        .edit-btn { background: #252528; color: #fff; border: 1px solid #444; }
        .edit-btn:hover { border-color: #00ff00; color: #00ff00; }
        .delete-btn { background: #2a1212; color: #ff5555; border: 1px solid #5a1a1a; }
        .delete-btn:hover { background: #dd0000; color: #000; }
        .modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.85); z-index: 100; display: none; justify-content: center; align-items: center; padding: 20px; }
        .modal-box { background: #1a1a1c; border: 1px solid #2d2d30; width: 100%; max-width: 550px; padding: 30px; }
        .modal-box h2 { font-family: 'Montserrat', sans-serif; color: #dd0000; text-transform: uppercase; margin-bottom: 20px; font-size: 1.5rem; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 0.8rem; color: #8a8a8f; text-transform: uppercase; margin-bottom: 5px; font-weight: bold; }
        .modal-box input, .modal-box textarea { width: 100%; background: #121214; border: 1px solid #2d2d30; color: #fff; padding: 12px; font-size: 1rem; }
        .modal-box input:focus, .modal-box textarea:focus { outline: none; border-color: #dd0000; }
        .modal-box textarea { resize: vertical; min-height: 120px; }
        .modal-buttons { display: flex; gap: 10px; margin-top: 20px; }
        .modal-btn { flex: 1; padding: 14px; font-weight: bold; text-transform: uppercase; cursor: pointer; border: none; }
        .save-btn { background: #dd0000; color: #000; font-family: 'Montserrat', sans-serif; font-weight: 900; }
        .cancel-btn { background: #252528; color: #fff; }
    </style>
</head>
<body>

    <header>
        <div class="logo"><h1>ССБА</h1></div>
        <div class="secret-tag">Панель Модерации</div>
    </header>
    <div class="red-bar"></div>

    <div class="main-content-wrapper">
        <div class="container">
            
            <section id="about-edit-section">
                <h2 class="section-title">Редактировать «О канале»</h2>
                <div class="about-edit-box">
                    <textarea id="about-edit-textarea" placeholder="Текст о канале..."></textarea>
                    <button class="action-btn save-btn" style="max-width:250px;" onclick="saveAboutText()">Обновить</button>
                </div>
            </section>
            
            <section id="posts">
                <h2 class="section-title">Посты</h2>
                <div class="grid" id="posts-container"></div>
            </section>

            <section id="photo">
                <h2 class="section-title">Фотогалерея</h2>
                <div class="grid" id="photo-container"></div>
            </section>

            <section id="video">
                <h2 class="section-title">Видеоархив</h2>
                <div class="grid" id="video-container"></div>
            </section>

            <section id="music">
                <h2 class="section-title">Музыка</h2>
                <div class="grid" id="music-container"></div>
            </section>

            <section id="books">
                <h2 class="section-title">Библиотека</h2>
                <div class="grid" id="books-container"></div>
            </section>

        </div>
    </div>

    <div class="modal-overlay" id="edit-modal">
        <div class="modal-box">
            <h2>Редактировать</h2>
            <div class="form-group">
                <label>Заголовок</label>
                <input type="text" id="edit-title">
            </div>
            <div class="form-group">
                <label>Текст</label>
                <textarea id="edit-text"></textarea>
            </div>
            <div class="form-group">
                <label>Файл</label>
                <input type="file" id="edit-hidden-file-input" style="display:none;" onchange="handleEditFileChange(event)">
                <button type="button" class="action-btn edit-btn" style="width:100%;" onclick="triggerEditUpload()">Заменить файл</button>
                <div id="edit-upload-status" style="margin-top:5px; font-size:0.85rem; font-style:italic;"></div>
            </div>
            <div class="modal-buttons">
                <button type="button" class="modal-btn save-btn" onclick="saveChanges()">СОХРАНИТЬ</button>
                <button type="button" class="modal-btn cancel-btn" onclick="closeEditModal()">ОТМЕНА</button>
            </div>
        </div>
    </div>

</body>
</html>
